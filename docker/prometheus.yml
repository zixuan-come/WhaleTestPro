global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'whaletestpro'
    static_configs:
      # compose 里全在同一网络，直接用服务名 app + 容器内端口 8000（不是宿主机的 8001）
      - targets: ['app:8000']

  - job_name: 'whale-perf-worker'
    static_configs:
      # Prometheus 与 worker 同在 whale 网络，直接使用 Compose 服务名。
      - targets: ['worker:8002']

  - job_name: 'rabbitmq'
    static_configs:
      # rabbitmq_prometheus 插件在容器内的默认端口。
      - targets: ['rabbitmq:15692']
