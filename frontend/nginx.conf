# 自定义访问日志格式:在标准 combined 基础上追加 rt=请求耗时、urt=上游耗时,
# 供 scripts/analyze_log.sh 做慢请求分析(按 rt= 键解析,不受列错位影响)。
# ⚠️ log_format 只能在 http 上下文声明;本文件作为 conf.d/*.conf 片段被主 nginx.conf
#    的 http{} include,故必须写在 server{} 块【外面】(写进 server 内会 emerg 拒启动)。
log_format timed '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'rt=$request_time urt="$upstream_response_time"';

server {
    listen 80;

    # Docker service addresses change when app is recreated independently.
    # A variable host (without a URI suffix) re-resolves through Docker DNS and
    # forwards the rewritten URI and original query in every API location.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $api_backend app:8000;
    proxy_connect_timeout 5s;

    access_log /var/log/nginx/access.log timed;

    # SPA:静态资源找不到就回落到 index.html(hash 路由/刷新不 404)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Selected regressions can contain several scenarios.
    location = /api/regression/run {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Synchronous executions may contain retries or several sequential steps.
    # Keep the proxy alive slightly longer than the browser's 10-minute limit.
    location ~ ^/api/(interfaces/[0-9]+/run|cases/([0-9]+/run|chain)|scenarios/[0-9]+/(run|debug)|suites/[0-9]+/run|traffic/replay/[0-9]+)$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_read_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 反代后端:与 vite dev proxy 的 rewrite 规则保持一致(去掉 /api 前缀)
    # app 是 docker-compose 里的后端服务名,容器内走 8000
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
