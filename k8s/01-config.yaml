# 配置与密钥
#
# compose 从 .env 读 SECRET_KEY / MYSQL_ROOT_PASSWORD,并给 app/worker 注入一串
# DATABASE_URL 等环境变量。这里拆成:
#   - Secret     放敏感值(密码、SECRET_KEY、连接串——含密码故整体入 Secret)
#   - ConfigMap  放非敏感值(REDIS_URL、CELERY_BROKER_URL 等)
#
# ⚠️ 学习用 manifest:此处 stringData 为占位明文,便于理解。真集群请改用
#    `kubectl create secret` 或 SealedSecrets / External Secrets,勿把真密码提交进仓库
#    (与项目铁律一致:敏感值从 .env/密钥管理来,不硬编码)。
---
apiVersion: v1
kind: Secret
metadata:
  name: whaletestpro-secret
  namespace: whaletestpro
type: Opaque
stringData:
  # 占位值 —— 部署前替换,或改用 kubectl create secret 覆盖
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_root_password"
  SECRET_KEY: "CHANGE_ME_jwt_secret_key"
  # 含密码的连接串整体作为敏感值(服务名即 K8s Service 名,同 namespace 内 DNS 可达)
  DATABASE_URL: "mysql+pymysql://root:CHANGE_ME_root_password@mysql:3306/whale_test_pro?charset=utf8mb4"
  SHADOW_DATABASE_URL: "mysql+pymysql://root:CHANGE_ME_root_password@mysql:3306/whale_test_pro_shadow?charset=utf8mb4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whaletestpro-config
  namespace: whaletestpro
data:
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "amqp://guest:guest@rabbitmq:5672//"
  MYSQL_DATABASE: "whale_test_pro"
---
# Prometheus 抓取配置(对应 compose 挂载的 docker/prometheus.yml)
# K8s 里无 host.docker.internal,worker 指标改抓 app Service(worker 若单开 8002 另配)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: whaletestpro
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: 'whaletestpro'
        static_configs:
          - targets: ['app:8000']
